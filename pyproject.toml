[project]
name = "ai-engineering-from-scratch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "jupyter>=1.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "torchaudio>=2.0",
    "tensorflow>=2.21",
    "transformers>=4.30",
    "datasets>=2.14",
    "tokenizers>=0.13",
    "accelerate>=0.20",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "pillow>=10.0",
    "librosa>=0.10",
    "numba>=0.59",
    "soundfile>=0.12",
    "tiktoken>=0.5",
    "anthropic>=0.25",
    "openai>=1.0",
    "python-dotenv>=1.2.2",
    "huggingface-hub>=1.24.0",
]

[project.optional-dependencies]
torch = ["torch>=2.3", "torchvision>=0.18"]
llm = ["anthropic>=0.39", "openai>=1.50"]
